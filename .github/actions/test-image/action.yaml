name: Test image
description: >
  Build inventree-nfc-test:<version> (tests/Dockerfile) from InvenTree's image, pulled with
  retries. A plain docker build, so the base is the local copy and the registry is asked once.
inputs:
  inventree:
    description: The InvenTree version (an image tag)
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/pull-inventree
      with:
        inventree: ${{ inputs.inventree }}
    - shell: bash
      env:
        VERSION: ${{ inputs.inventree }}
      run: >
        docker build --quiet -f tests/Dockerfile --build-arg "INVENTREE_VERSION=$VERSION"
        -t "inventree-nfc-test:$VERSION" tests
