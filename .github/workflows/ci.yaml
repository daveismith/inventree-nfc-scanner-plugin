# Ensure that the plugin meets the required style guidelines
# Ensure that the plugin builds correctly

# Actions are pinned by commit hash; the comment after each is the release it maps to.

name: CI Checks

# Pull requests, and main once merged: a branch with a pull request would otherwise run
# twice, for the push and for the pull request. Any other branch: Actions → Run workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Deps
        run: |
          pip install ruff==0.12.0   # the version .pre-commit-config.yaml pins
          pip install -U wheel setuptools twine build
      - name: Style Checks
        run: |
          ruff check
          ruff format --check --preview
      - name: Build Plugin
        run: |
          python -m build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm run lint
      - name: The committed bundle must be the one these sources build
        # An install from git uses inventree_nfc_scanner/static/ as committed; a release
        # rebuilds it. This keeps the two the same.
        run: |
          if [ -n "$(git status --porcelain -- inventree_nfc_scanner/static/)" ]; then
            git status --short -- inventree_nfc_scanner/static/
            echo "::error::inventree_nfc_scanner/static/ is out of date: run 'npm run build' in frontend/ and commit the result"
            exit 1
          fi
