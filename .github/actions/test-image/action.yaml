name: Test image
description: Build inventree-nfc-test:<version> (tests/Dockerfile), cached between runs.
inputs:
  inventree:
    description: The InvenTree version (an inventree/inventree image tag)
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: tests
        file: tests/Dockerfile
        build-args: INVENTREE_VERSION=${{ inputs.inventree }}
        tags: inventree-nfc-test:${{ inputs.inventree }}
        load: true
        cache-from: type=gha,scope=inventree-${{ inputs.inventree }}
        cache-to: type=gha,mode=max,scope=inventree-${{ inputs.inventree }}
