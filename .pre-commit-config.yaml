repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.0
    hooks:
      - id: ruff-format
        args: [ --preview ]
      - id: ruff
        # The same rule set as CI's `ruff check`; the formatter alone runs with --preview.
        args: [ --fix ]
-   repo: https://github.com/biomejs/pre-commit
    rev: v2.0.0
    hooks:
    -   id: biome-check
        additional_dependencies: ["@biomejs/biome@2.0.0"]
        files: ^frontend/src.*\.(js|ts|tsx)$
