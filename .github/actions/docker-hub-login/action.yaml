name: Docker Hub login
description: >
  Log in to Docker Hub, so image pulls count against the account's allowance rather than the
  anonymous one (about 10 an hour per IP address, which GitHub's runners share). Skipped when
  no username or token is given (a pull request from a fork gets no secrets), and a login
  that fails (Docker Hub's sign-in is down now and then) does not fail the job: either way it
  pulls anonymously.
inputs:
  username:
    description: >
      The DOCKERHUB_USERNAME repository variable. A variable, not a secret: a secret's value
      is masked wherever it appears in the logs, and a username that is also the GitHub
      account's would hide the repository's own name.
    required: false
  token:
    description: The DOCKERHUB_TOKEN secret (a read-only access token)
    required: false
runs:
  using: composite
  steps:
    - if: inputs.username != '' && inputs.token != ''
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
