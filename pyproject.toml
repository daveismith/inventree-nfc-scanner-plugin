#This file is used to package the InvenTreeNFCScanner plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-nfc-scanner"
description = "Program and read the NFC tags on storage bins, over USB (WebSerial) or from a networked scanner"
dynamic = ["version"]
authors = [
    { name = "David Smith",email = "daveismith@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/daveismith/inventree-nfc-scanner-plugin"

[project.entry-points."inventree_plugins"]
InvenTreeNFCScanner = "inventree_nfc_scanner.core:InvenTreeNFCScanner"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "inventree_nfc_scanner.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_nfc_scanner"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p tests.inventree_setup --strict-markers -ra"
markers = [
    "pure: no InvenTree needed",
    "server: needs InvenTree, runs in process (pytest-django)",
    "postgres: needs PostgreSQL's row locks; skipped on SQLite",
    "browser: Playwright against the containerised stack",
    "firmware: the firmware's simulator in the loop",
]
filterwarnings = [
    # InvenTree's, not ours
    "ignore:The django-stdimage is deprecated:DeprecationWarning",
    "ignore:Accessing the database during app initialization:RuntimeWarning",
    "ignore:A plugin registry reload was triggered:UserWarning",
    "ignore:DateTimeField NotificationEntry.updated received a naive datetime:RuntimeWarning",
]

[tool.coverage.run]
source = ["inventree_nfc_scanner"]
omit = ["*/migrations/*"]
branch = true
relative_files = true

[tool.coverage.paths]
# Measured in the test container, where the working tree is /plugin.
source = ["inventree_nfc_scanner/", "/plugin/inventree_nfc_scanner/"]

[tool.coverage.report]
show_missing = true
skip_covered = false
