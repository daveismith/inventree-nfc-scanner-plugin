# The test suite (tests/, docs/test-suite-plan.md): the pure and server layers against every
# supported InvenTree version (tests/inventree-versions.json), on SQLite. Each leg runs in a
# container with no network (tests/run.sh); results are published as one check run, and
# coverage is combined across the legs.
#
# Actions are pinned by commit hash; the comment after each is the release it maps to.

name: Tests

# Pull requests, and main once merged: a branch with a pull request would otherwise run
# twice, for the push and for the pull request. Any other branch: Actions → Run workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.read.outputs.supported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "supported=$(jq -c .supported tests/inventree-versions.json)" >> "$GITHUB_OUTPUT"

  server:
    name: server (InvenTree ${{ matrix.inventree }}, SQLite)
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        inventree: ${{ fromJSON(needs.versions.outputs.supported) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-image
        with:
          inventree: ${{ matrix.inventree }}
      - name: Test
        env:
          COVERAGE_FILE: test-results/coverage-${{ matrix.inventree }}-sqlite.dat
        run: >
          tests/run.sh --no-build --version ${{ matrix.inventree }}
          -m "pure or server"
          --junitxml=test-results/junit-${{ matrix.inventree }}-sqlite.xml
          -o junit_suite_name="InvenTree ${{ matrix.inventree }}, SQLite"
          --cov --cov-report=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.inventree }}-sqlite
          path: test-results/
          retention-days: 14

  report:
    needs: server
    if: always() && needs.server.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report
        with:
          check-name: Test results
