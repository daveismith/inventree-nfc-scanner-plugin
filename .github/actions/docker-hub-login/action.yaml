name: Docker Hub login
description: >
  Log in to Docker Hub, so image pulls count against the account's allowance rather than the
  anonymous one (about 10 an hour per IP address, which GitHub's runners share). Skipped when
  no token is given: a pull request from a fork gets no secrets, and pulls anonymously.
inputs:
  username:
    description: The DOCKERHUB_USERNAME secret
    required: false
  token:
    description: The DOCKERHUB_TOKEN secret (a read-only access token)
    required: false
runs:
  using: composite
  steps:
    - if: inputs.token != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
